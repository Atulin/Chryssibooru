name: chryssibooru
description: Derpibooru client made with Flutter
publish_to: none

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
version: 1.6.3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Image loading with disk cache, progress reporting, and error widgets.
  cached_network_image: ^4.0.7
  # Used to report and clear the image disk cache (drawer entry).
  flutter_cache_manager: ^3.5.0
  # SVG rendering for the logo and other branding assets.
  flutter_svg: ^2.3.4
  # Saving images to the device gallery (Android/iOS).
  gal: ^3.0.0
  # HTTP client for the Derpibooru API and downloads.
  http: ^1.6.0
  # Application version info (about dialog).
  package_info_plus: ^10.2.2
  # Cache directory lookup for the cache size readout.
  path_provider: ^2.1.6
  # Video playback progress bar.
  percent_indicator: ^4.2.5
  # State management for the search repository.
  provider: ^6.1.5
  # Sharing links to other apps.
  share_plus: ^13.3.1
  # Preferences, search history, favourites, API key storage.
  shared_preferences: ^2.5.6
  # Opening links in the browser.
  url_launcher: ^6.3.3
  # Image and video playback in the full-screen viewer.
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Used to fake directory lookups in widget tests.
  path_provider_platform_interface: ^2.1.3

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo-xlarge-sq.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo-xlarge-sq.png"

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo-small.png
    - assets/logo-medium.png
    - assets/logo-large.png
    - assets/logo-xlarge.png
    - assets/logo.svg
    - assets/github.svg
